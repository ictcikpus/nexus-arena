name: Validate NEXUS ARENA
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: client
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: client
        run: npm run build
      - name: Check source syntax
        run: node --check worker/index.js && node --check client/src/network/cloudflare-client.js && node --check client/src/main.js
